<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — SSK Store (Kalakunj Mandir)</title>
  <script>
    (function() {
      var stored = localStorage.getItem('ssk-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      text-align: center;
      background: var(--bg);
      color: var(--text);
    }
    .offline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: var(--space-8) var(--space-6);
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .offline-icon-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--stat-amber-bg);
      color: var(--stat-amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto var(--space-4);
      border: 2px solid var(--stat-amber);
    }
    .offline-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--heading);
      margin-bottom: var(--space-2);
    }
    .offline-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: var(--space-6);
    }
    .offline-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="offline-card">
    <div style="margin-bottom: var(--space-6);">
      <div class="brand-logo-plate" style="display: inline-block; padding: 6px 14px; border-radius: 12px; background: #FFFFFF; box-shadow: var(--shadow-sm);">
        <img src="assets/brand/logo.png" alt="Shri Sahajanand Sahitya Kendra - Kalakunj Mandir" style="height: 48px; width: auto; display: block;">
      </div>
    </div>

    <div class="offline-icon-box" aria-hidden="true">
      📡
    </div>

    <span style="display: inline-block; background: var(--surface-2); color: var(--red-text); padding: 0.25rem 0.85rem; border-radius: var(--radius-full); font-size: 0.8125rem; font-weight: 700; margin-bottom: var(--space-3);">
      Jay Swaminarayan • જય સ્વામિનારાયણ
    </span>

    <h1 class="offline-title">
      You're Offline<br>
      <span style="font-size: 1.35rem; font-weight: 700;" lang="gu">તમે ઑફલાઇન છો</span>
    </h1>

    <p class="offline-desc">
      We cannot reach the SSK Store server right now. Please check your Wi-Fi or mobile data connection and try again.<br><br>
      <span lang="gu">કૃપા કરીને તમારું ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો.</span>
    </p>

    <div class="offline-actions">
      <button type="button" class="btn btn-primary btn-lg" onclick="window.location.reload()">
        🔄 Try Again • ફરી પ્રયાસ કરો
      </button>
      <a href="/" class="btn btn-secondary btn-lg">
        Home • મુખ્ય પૃષ્ઠ
      </a>
    </div>
  </div>

</body>
</html>
